[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=Xvfb :1 -screen 0 1280x1024x24
autorestart=true

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
autorestart=true

[program:x11vnc]
command=x11vnc -display :1 -nopw -forever -shared
autorestart=true

[program:websockify]
command=websockify --web /usr/share/novnc/ 6080 localhost:5901
autorestart=true

[program:sandbox-api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/sandbox
autorestart=true
